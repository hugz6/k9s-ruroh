name: Sync Fork (Auto)
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/derailed/k9s.git || true
          git fetch upstream --tags --prune

      - name: Sync main
        run: |
          git checkout -B main
          git reset --hard upstream/master
          git push origin main --force

      - name: Rebase and push feat-ruroh
        run: |
          git checkout feat-ruroh
          git rebase main || {
            git rebase --abort
            echo "::error::Rebase failed, manual conflict resolution required."
            exit 1
          }
          git push origin feat-ruroh --force-with-lease

      - name: Tag new version if needed
        run: |
          UPSTREAM_TAG=$(git describe --tags --abbrev=0 upstream/master)
          MY_TAG="${UPSTREAM_TAG}-ruroh"
          echo "Upstream: ${UPSTREAM_TAG} -> mine: ${MY_TAG}"
          if git rev-parse -q --verify "refs/tags/${MY_TAG}" >/dev/null; then
            echo "Tag ${MY_TAG} already exists, nothing to do."
          else
            git tag "$MY_TAG"
            git push origin "$MY_TAG"
          fi
